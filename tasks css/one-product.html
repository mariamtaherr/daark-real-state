<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product card with corner badge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="one-product.css">
</head>

<body>

    <main>

       
        <div class="cards">

            <div class="card">

                <div class="card-image">
                                  <div class="icons">               <button><i class="fa-regular fa-heart"></i></button></div>
                    <div class="circle"><img src="../bag.jpeg"/></div>
                </div>
                <div class="sale"> 
                    <span>SALE 30% OFF</span>
                </div>

                <div class="card-content">
                    <span>Vellum Desk Lamp</span>


                    <p>
                       Warm dimmable light with a brushed aluminium arm.
                    </p>

                    <div class="card-bottom">
                        <strong>$49</strong>
                        <div class="dashed"> <strong> $120.00</strong> </div>
                     

                    </div>
                    <button>Add to cart</button>
                </div>

            </div>
</main>

</body>
</html>
